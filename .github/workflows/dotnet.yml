name: .NET Test and Build Artifact

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ./JustDanceEditor.slnx -p:UseLocalKevIncProjects=false

      - name: Build
        run: dotnet build ./JustDanceEditor.slnx --configuration Release --no-restore -p:UseLocalKevIncProjects=false

      - name: Test
        shell: bash
        run: |
          # Editor tests use Avalonia.Headless.XUnit, which currently deadlocks on GitHub-hosted runners.
          while IFS= read -r project; do
            echo "Testing $project"
            dotnet test "$project" --configuration Release --no-build --no-restore -p:UseLocalKevIncProjects=false
          done < <(find . -path './JustDanceEditor.Editor.Tests/*' -prune -o -name '*.Tests.csproj' -print | sort)

      - name: Publish cross-platform release bundles
        shell: pwsh
        run: |
          $bundles = @(
            @{
              Name = 'Windows'
              Platforms = @('win-x64')
              IncludeEditor = $true
            },
            @{
              Name = 'Linux'
              Platforms = @('linux-x64', 'linux-arm64')
              IncludeEditor = $true
            },
            @{
              Name = 'macOS'
              Platforms = @('osx-x64', 'osx-arm64')
              IncludeEditor = $true
            }
          )

          foreach ($release in $bundles) {
            $bundle = "./artifacts/JustDanceEditor-$($release.Name)"

            foreach ($platform in $release.Platforms) {
              $platformFolder = "$bundle/$platform"

              dotnet publish ./JustDanceEditor.Cli/JustDanceEditor.Cli.csproj `
                --configuration Release `
                --runtime $platform `
                --self-contained false `
                -p:UseLocalKevIncProjects=false `
                --output "$platformFolder"

              dotnet publish ./JustDanceEditor.GUI/JustDanceEditor.GUI.csproj `
                --configuration Release `
                --runtime $platform `
                --self-contained false `
                -p:UseLocalKevIncProjects=false `
                --output "$platformFolder"

              if ($release.IncludeEditor) {
                dotnet publish ./JustDanceEditor.Editor/JustDanceEditor.Editor.csproj `
                  --configuration Release `
                  --runtime $platform `
                  --self-contained false `
                  -p:UseLocalKevIncProjects=false `
                  --output "$platformFolder"
              }
            }
          }

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: JustDanceEditor-Windows
          path: artifacts/JustDanceEditor-Windows/

      - name: Upload Linux release
        uses: actions/upload-artifact@v4
        with:
          name: JustDanceEditor-Linux
          path: artifacts/JustDanceEditor-Linux/

      - name: Upload macOS release
        uses: actions/upload-artifact@v4
        with:
          name: JustDanceEditor-macOS
          path: artifacts/JustDanceEditor-macOS/
